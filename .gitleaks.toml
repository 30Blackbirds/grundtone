[extend]
useDefault = true

# Exceptions are dangerous because they are silent, so this is ONE exact value,
# not a file and not a pattern.
#
# `generic-api-key` matches the SonarQube projectKey in sonar-project.properties
# and .sonarlint/connectedMode.json. The key is a public project identifier;
# access needs SONAR_TOKEN, which lives in GitHub secrets and never in the repo.
#
# A path allowlist would exempt the whole file: a token pasted next to the key
# would no longer be caught. Binding the exception to the literal value means a
# key change fails the scan and has to be looked at again.
#
# The second value is the previous key. It is no longer in the tree, but it is
# in git history, and the CI job scans history.
[allowlist]
description = "SonarQube projectKey: a public identifier, not a credential"
regexes = [
  '''30blackbirds_grundtone''',
  '''KlangHaus_grundtone_7614edb4-1c54-485f-89b0-0867d3e04552''',
]
