# SonarQube analysis of this repository.
#
# The analysis runs only when all three are set:
#   - organisation variable SONARQUBE_ENABLED = 'true'
#   - secret SONAR_HOST_URL
#   - secret SONAR_TOKEN
# Otherwise the job stays green and says, in a notice, that nothing was
# analysed. Fork PRs and Dependabot PRs receive no secrets, so they always take
# that path.
#
# Steps are skipped, never the job: a skipped job reports no status, and a
# required check that never arrives blocks the PR.
#
# The quality-gate step is commented out on purpose. Today the check reports;
# making it gate is a separate decision. When that is decided, enable the gate
# step first and only then mark the check as required, or PRs wait for a
# status that never comes.
#
# The project key lives in one place, sonar-project.properties.

name: SonarQube

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares its own permissions.
permissions: {}

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-level env, because the `secrets` context is not allowed in a
    # step's `if:`.
    env:
      SONARQUBE_ENABLED: ${{ vars.SONARQUBE_ENABLED }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    permissions:
      contents: read

    steps:
      - name: Decide whether to analyse
        id: gate
        run: |
          if [ "$SONARQUBE_ENABLED" = 'true' ] && [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "analyse=true" >> "$GITHUB_OUTPUT"
          else
            echo "analyse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain why the analysis was skipped
        if: steps.gate.outputs.analyse != 'true'
        run: |
          echo "::notice::SonarQube skipped: SONARQUBE_ENABLED is not 'true', or SONAR_HOST_URL/SONAR_TOKEN is empty."
          echo "::notice::Green here means 'not analysed', not 'analysed without findings'."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.analyse == 'true'
        with:
          # Sonar uses history to decide what is new code. A shallow clone
          # makes everything look new.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.analyse == 'true'
        with:
          version: 10.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.analyse == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.analyse == 'true'
        run: pnpm install --frozen-lockfile

      # Tests import workspace packages through their dist/ folders, so the
      # packages must be built before the coverage run.
      - name: Build packages
        if: steps.gate.outputs.analyse == 'true'
        run: pnpm build:packages

      - name: Test with coverage
        if: steps.gate.outputs.analyse == 'true'
        run: pnpm test:coverage

      # Without lcov, Sonar reports 0% coverage, which looks like a regression
      # rather than a missing file.
      - name: Check that lcov exists
        if: steps.gate.outputs.analyse == 'true'
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info is missing or empty"
            exit 1
          fi
          echo "lcov.info: $(wc -l < coverage/lcov.info) lines"

      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        if: steps.gate.outputs.analyse == 'true'

      # Diagnostic only: the gate message gives counts, not the findings.
      - name: Print Sonar findings in the log
        if: ${{ always() && github.event_name == 'pull_request' && steps.gate.outputs.analyse == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SONAR_PROJECT_KEY=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
          export SONAR_PROJECT_KEY
          bash scripts/print-sonar-findings.sh

      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   if: steps.gate.outputs.analyse == 'true'
      #   timeout-minutes: 5
